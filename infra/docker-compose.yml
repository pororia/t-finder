version: '3.9'
services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: tfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tfinder
      POSTGRES_PASSWORD: tfinder_dev_password
      POSTGRES_DB: tfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tfinder-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://tfinder:tfinder_dev_password@postgres:5432/tfinder
      - JWT_SECRET_KEY=dev_secret_key_change_in_production
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-admin-sdk.json
      - FIREBASE_STORAGE_BUCKET=t-finder.appspot.com
      - PASSWORD_ENCRYPTION_KEY=dev_encryption_key_32_bytes_pad
      - CORS_ORIGINS=["http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
